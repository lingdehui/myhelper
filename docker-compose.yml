version: '3.8'

services:
  neo4j:
    image: neo4j:community
    container_name: neo4j
    ports:
      - "7474:7474"  # 浏览器访问端口
      - "7687:7687"  # Java代码连接端口 (Bolt协议)
    volumes:
      - D:/docker/neo4j/data:/data
      - D:/docker/neo4j/logs:/logs
      - D:/docker/neo4j/import:/var/lib/neo4j/import
    environment:
      - NEO4J_AUTH=neo4j/ll425972

  # 向量数据库
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - D:/docker/qdrant/data:/qdrant/storage
    restart: unless-stopped

  # Home Assistant 智能家居中枢
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    ports:
      - "8123:8123"
    volumes:
      - D:/docker/ha/config:/config
    restart: unless-stopped
