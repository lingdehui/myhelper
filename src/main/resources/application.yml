server:
  port: 8082
spring:
  config:
    import:
      - classpath:config/desktopbrain-voice.yml
      - classpath:config/desktopbrain-dialog.yml
      - classpath:config/desktopbrain-tool.yml
      - classpath:config/desktopbrain-semantic.yml
      - classpath:config/desktopbrain-exploration.yml
  ai:
    mcp:
      client:
        streamable-http:
          connections:
            robot-mcp:
              url: http://127.0.0.1:8081/mcp
              request-timeout: 30s
    openai:
      api-key: sk-5f0c105555904aec8c86953f3a91a528
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
  # ===== Neo4j 知识图谱 =====
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ll425972

# ===== Qdrant 向量数据库 =====
qdrant:
  host: localhost
  port: 6333
  collection: desktop-memory
  episodes-collection: episodes      # Episode 经验学习集合（ExpeL/MUSE）
  vector-size: 768
  episode:                            # Episode 检索/淘汰参数
    similarity-threshold: 0.65        # 向量相似度阈值（nomic-embed-text 中文短句推荐 0.65）
    stability-threshold: 0.6          # 稳定度阈值（success/(success+fail) >= 0.6 才复用）
    failure-threshold: 3              # 连续失败达此阈值自动归档
    top-k: 3                          # 向量检索返回数量

# ===== Home Assistant 智能家居 =====
homeassistant:
  url: http://localhost:8123
  # 安装后在 HA 后台创建长期访问令牌，替换下面的值
