server:
  port: 8082
spring:
  ai:
    mcp:
      client:
        streamable-http:
          connections:
            robot-mcp:
              url: http://127.0.0.1:8081/mcp
              request-timeout: 30s
    openai:
      api-key: sk-5f0c105555904aec8c86953f3a91a528
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
  # ===== Neo4j 知识图谱 =====
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ll425972

# ===== Qdrant 向量数据库 =====
qdrant:
  # REST 连接协议；远程服务可改为 https。
  scheme: http
  host: localhost
  port: 6333
  collection: desktop-memory
  episodes-collection: episodes      # Episode 经验学习集合（ExpeL/MUSE）
  vector-size: 768
  # 初始化时按配置检查现有集合，不覆盖不匹配的集合。
  distance: Cosine
  # 连接及单次请求的等待上限。
  request-timeout: 30s
  # 本地无认证时为空，部署时从环境变量提供。
  api-key: ${QDRANT_API_KEY:}
  episode:                            # Episode 检索/淘汰参数
    similarity-threshold: 0.65        # 向量相似度阈值（nomic-embed-text 中文短句推荐 0.65）
    stability-threshold: 0.6          # 稳定度阈值（success/(success+fail) >= 0.6 才复用）
    failure-threshold: 3              # 连续失败达此阈值自动归档
    top-k: 3                          # 向量检索返回数量

# ===== Home Assistant 智能家居 =====
homeassistant:
  url: http://localhost:8123
  # 安装后在 HA 后台创建长期访问令牌，替换下面的值
  access-token: YOUR_HA_LONG_LIVED_ACCESS_TOKEN

# ===== Ollama 嵌入模型 =====
embedding:
  model: nomic-embed-text

logging:
  level:
    org.springframework.ai.mcp: WARN
    io.modelcontextprotocol: WARN
    org.springframework.web: WARN
    org.neo4j: WARN

# 循环主流程：门限仅决定固化工具是否跳过模型，不替代发布状态、门禁和验收。
myhelper:
  records:
    # 正式入口默认保存任务和恢复状态；关闭只适用于明确无持久恢复的演示。
    enabled: true
    # 每页读取候选上限；启动扫描会沿游标继续后续页面。
    recovery-batch-size: 4
    # 可设置 state-directory；缺省为用户目录下 .myhelper/task-runtime。
    # 同一安装必须始终使用同一路径，不复制、不删除正在使用的 task-owner.lock。
  orchestration:
    # 普通技能和可信原子工具的估计成功率都必须严格超过此值。
    direct-tool-reliability-threshold: 0.85
    # 普通固化技能需要的实际累计成功次数，可信原子工具免此项。
    direct-tool-minimum-successes: 5
