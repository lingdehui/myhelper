# ===== 自主探索引擎配置 =====
desktopbrain:
  exploration:
    enabled: true
    idle-threshold-minutes: 30       # 空闲多久后触发探索
    max-duration-minutes: 15         # 单次探索最长耗时
    blackout-hours: []               # 留空=全天可探索
    base-url: http://localhost:11434/v1      # Ollama 本地 qwen2.5:14b（备）
    model: qwen2.5:14b                        # 模型1 故障/能力不足时降级
    allowed-domains:                 # 浏览器白名单域名
      - docs.spring.io
      - developer.mozilla.org
      - github.com
      - stackoverflow.com

  # ===== 记忆维护 =====
  memory-maintenance:
    enabled: true
    cron: 0 0 4 * * ?            # 凌晨4点执行
    threshold: 0.7                # 触发清理的占用率
    target: 0.5                   # 清理后目标占用率
    weights:                         # 价值评分权重
      recency: 0.3
      usage: 0.3
      user-produced: 0.25
      dependency: 0.15
    retention-rules:                 # 按来源设置保留天数
      user-task: 365
      autonomous-exploration: 90
      failure-pattern: 180
      default: 90                    # 未匹配来源的默认保留天数
