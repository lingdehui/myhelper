# ===== 语音交互 =====
desktopbrain:
  voice:
    wake-word: "那个谁"
    sample-rate: 16000
    energy-threshold: 0.02
    min-speech-duration-ms: 400
    max-speech-duration-ms: 10000
    silence-timeout-ms: 2000
    tts-echo-drain-ms: 300
    event-poll-interval-ms: 200
    beep:
      frequency: 800
      amplitude: 80

  # --- Silero VAD ---
  vad:
    threshold: 0.5
    min-silence-duration: 1.2
    min-speech-duration: 0.25
    max-speech-duration: 8.0
    window-size: 512

  # --- 声纹 ---
  voiceprint:
    max-enrollment-segments: 3
